# Application name
spring.application.name=demo-docker

# Run on port 8099 as requested
server.port=8099

# Nicer JSON error bodies are already handled by our GlobalExceptionHandler,
# but this keeps Spring's default error page minimal too.
server.error.include-message=always

# Slightly more readable logs while learning
logging.level.org.springframework.web=INFO

# Expose all actuator endpoints over HTTP
management.endpoints.web.exposure.include=health,info,metrics,threaddump
management.endpoint.health.show-details=always

server.tomcat.mbeanregistry.enabled=true

logging.pattern.level=%5p [${spring.application.name:demo-crud},%X{traceId:-},%X{spanId:-}]
